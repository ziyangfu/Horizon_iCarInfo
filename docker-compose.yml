services:
  horizon:
    build:
      context: .
      # args:
      #   EXTRAS: trafilatura  # comma-separated optional extras, e.g. "trafilatura,openbb"
    container_name: horizon
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - TZ=UTC
    restart: "no"
    # One-shot execution; daily scheduling uses docker-compose.scheduler.yml.
    # For one-time run, use: docker compose run --rm horizon
    command: ["--hours", "24"]
